<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YesMom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Login Screen -->
    <div id="login-screen" class="screen">
        <div class="brand">
            <h1>YesMom</h1>
            <p>Private Family Intercom</p>
        </div>
        <button id="google-login-btn" class="auth-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
            Sign in with Google
        </button>
    </div>

    <!-- Premium Walkie-Talkie Screen -->
    <div id="app-screen" class="screen hidden">
        <div class="header">
            <span id="user-greeting">Hello</span>
            <button id="logout-btn">Log out</button>
        </div>

        <h2 id="status-text" class="status-indicator">Ready.</h2>

        <div class="button-container">
            <button id="talk-btn" class="big-button">
                <span class="button-text">HOLD TO TALK</span>
            </button>
        </div>

        <div id="recipient-modal" class="hidden glass-panel">
            <h3>Contacts</h3>
            
            <!-- Permanent Contact Buttons Go Here -->
            <div id="saved-contacts" class="recipient-buttons"></div>
            
            <div class="divider"></div>
            
            <!-- Search to Add New Contacts -->
            <h3 style="font-size: 16px; color: #aeaeb2;">Add Family</h3>
            <div class="search-container">
                <input type="text" id="user-search-input" placeholder="Search name..." autocomplete="off">
                <button id="search-btn">Find</button>
            </div>
            <div id="search-results" class="recipient-buttons"></div>
            <button id="cancel-btn">Cancel</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
